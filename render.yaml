services:
  - type: web
    name: travel-anchor-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: COPILOT_MODEL
        value: gpt-5.6-luna
      - key: ALLOWED_ORIGINS
        value: https://hawtim.github.io
      - key: COPILOT_GITHUB_TOKEN
        sync: false
